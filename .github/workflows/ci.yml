name: CI
on:
  push:
    branches: [main, 'arena/**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: contextline_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d contextline_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:live
        env:
          CONTEXTLINE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/contextline_test
          CONTEXTLINE_TEST_PGVECTOR: '1'
          REDIS_URL: redis://localhost:6379
      - run: npm audit --omit=dev --audit-level=high
      - run: docker build -t contextline-worker:ci .
